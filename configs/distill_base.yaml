# Backbone chung cho CoT distillation (docs/experiment_design.md mục 5-6): mọi ô của ma trận thí nghiệm chỉ khác nhau
# ở head và loss. Mặc định multistream_clip đóng băng (caption, OCR, mô tả VLM, CLIP); đổi ở đây nếu plan
# phase4_baselines cho thấy backbone khác tốt hơn trên val.
inherit: fusion_multistream_clip_frozen.yaml
train:
  select_metric: macro_f1
  select_exclude_labels: [text-sarcasm]   # val chỉ có 1 mẫu text-sarcasm: F1 lớp này là 0 hoặc 1
  eval_test: false                        # private test chỉ chấm một lần ở bước cuối (--extra-eval test)
eval:
  prior_correction: true                  # evaluate.py ghi thêm kết quả hiệu chỉnh prior theo val
