# Phase 5: cross-attention 2 chiều, đóng băng cả 2 encoder, chỉ train các block cross-attention và head.
# Cùng chế độ train với fusion_concat_frozen (Phase 4) để chênh lệch đến từ cách kết hợp, không từ việc fine-tune encoder.
inherit: fusion_cross_attn.yaml
model:
  text_encoder:
    freeze: true
  image_encoder:
    freeze: true
train:
  lr_head: 1.0e-3   # giống fusion_concat_frozen; nếu train loss dao động thì thử override train.lr_head=3e-4
  epochs: 20        # early stopping patience 3 vẫn dừng sớm
