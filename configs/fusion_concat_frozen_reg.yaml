# Phase 4, mục 1: như fusion_concat_frozen nhưng regularize nhánh ảnh để head không học thuộc train qua vector CLIP cố định.
# LayerNorm + Linear(256) riêng mỗi nhánh, dropout 0.2 trên vector ảnh, và modality dropout: 30% mẫu train bỏ hẳn ảnh.
inherit: fusion_concat_frozen.yaml
model:
  fusion:
    proj_dim: 256
    image_feature_dropout: 0.2
    image_drop_prob: 0.3
    text_drop_prob: 0.0   # không bỏ text: nhánh ảnh một mình yếu (image_only_frozen ~0.36), ép học ảnh chỉ thêm overfit
