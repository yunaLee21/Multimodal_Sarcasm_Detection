# Config gốc, các config thí nghiệm kế thừa bằng `inherit: base.yaml` và chỉ ghi đè phần khác.
seed: 42

# Đường dẫn theo môi trường, utils/config.py tự chọn nhánh ứng với môi trường đang chạy.
paths:
  local:
    data_dir: data/raw
    output_dir: outputs
    cache_dir: data/processed
  server:   # GPU server riêng (VIMMSD_ENV=server): data/server/* là symlink ra ổ dữ liệu, tạo bằng scripts/server/prepare_data.sh
    data_dir: data/server/raw
    output_dir: data/server/outputs
    cache_dir: data/server/cache
  kaggle:
    data_dir: /kaggle/input/datasets/phuclkz/vimmsd-private-dataset   # public/private test đã có nhãn
    output_dir: /kaggle/working/outputs
    cache_dir: /kaggle/working/cache
  colab:
    data_dir: /content/drive/MyDrive/IE403/data/raw
    output_dir: /content/drive/MyDrive/IE403/outputs
    cache_dir: /content/drive/MyDrive/IE403/cache

data:
  # đường dẫn tương đối với paths.data_dir; kiểm tra lại tên file/thư mục sau khi tải ViMMSD
  train_json: vimmsd-train.json
  train_image_dir: training-images/train-images
  public_test_json: vimmsd-public-test.json
  public_test_labels: vimmsd-public-test-ref.json    # {"results": {id: nhãn}}; null nếu nhãn nằm sẵn trong json
  public_test_image_dir: public-test-images/dev-images
  private_test_json: vimmsd-private-test.json
  private_test_labels: vimmsd-private-test-ref.json
  private_test_image_dir: private-test-images/test-images
  labels: [not-sarcasm, text-sarcasm, image-sarcasm, multi-sarcasm]
  split: official    # official: train = toàn bộ train, val = public test, test = private test | random: chia từ train
  val_ratio: 0.1     # chỉ dùng khi split=random: val/test chia stratified từ tập train
  test_ratio: 0.1
  split_seed: null  # split=random: null = dùng seed; đặt cố định (vd 42) để nhiều seed train dùng chung train/val/test
  max_length: 256           # giới hạn của PhoBERT; p95 độ dài caption sau làm sạch ≈ 251 token
  max_caption_length: 200   # khi có text từ ảnh: caption cắt trước còn tối đa 200 token, phần còn lại cho segment 2
  text:
    lowercase: false
    normalize_teencode: true
    emoji: demojize   # keep | remove | demojize (emoji phổ biến sang tiếng Việt, còn lại tên tiếng Anh)
    word_segment: vncorenlp   # vncorenlp (PhoBERT, cần Java) | underthesea | none (ViSoBERT)
    cache_dir: null   # null = paths.cache_dir. Notebook train trên Kaggle: /kaggle/input/<output 01a>/cache
    cache_file: text_preprocessed.json  # tên file trong cache_dir; meta.pipeline_key sai thì tự bỏ qua, tạo lại
  image_resize: pad    # pad (letterbox vuông, giữ toàn bộ ảnh) | crop (center-crop của processor, như code cũ)
  image_augment: false # crop 90-100% + chỉnh sáng/tương phản, chỉ khi train
  sampler: random     # random | weighted (oversampling lớp hiếm)
  # Tiền xử lý ảnh thành text (tạo trước bằng scripts/extract_image_text.py, xem notebooks/01b):
  # chữ trong ảnh (OCR) + mô tả ảnh (VLM), ghép thành segment thứ 2 của PhoBERT cạnh caption.
  image_text:
    use_ocr: false
    use_description: false
    dir: null                 # null = paths.cache_dir; Kaggle: thư mục chứa image_preprocessed.json (dataset đã attach)
    file: image_preprocessed.json  # file gộp OCR + mô tả (scripts/build_image_text_dataset.py); null = đọc 2 cache dưới
    # cache trung gian của notebook 01b, mỗi bước một file; đổi model OCR/VLM thì dùng thư mục cache mới
    ocr_cache: ocr.json
    description_cache: description.json
  # CoT distillation (docs/experiment_design.md): reasoning của teacher đạt rubric, chỉ gắn vào mẫu train
  rationale:
    use: false
    dir: null                      # null = <paths.cache_dir>/rationales
    file: rationale_dataset.json   # scripts/build_rationale_dataset.py merge
    embeddings: rationale_embeddings.npy   # scripts/embed_rationales.py, kèm rationale_embeddings_ids.json
    exclude_groups: []             # vd [3]: ablation bỏ reasoning của bước rationalization

model:
  modality: concat    # text | image | concat | cross_attn
  text_encoder:
    name: vinai/phobert-base
    freeze: false
    unfreeze_last_n: 0   # chỉ dùng khi freeze: true, mở lại N block cuối để fine-tune nhẹ (0 = đóng băng hết)
  image_encoder:
    name: openai/clip-vit-base-patch32
    freeze: true
    unfreeze_last_n: 0   # như trên; CLIP mở thêm post_layernorm, ViT mở thêm layernorm cuối
  fusion: {}
  head:
    type: flat            # flat | hierarchical (M2: S × C) | cascade (định tuyến cứng kiểu Vu et al.), xem models/heads.py
    axis_heads: false     # head T/I: text / ảnh đứng riêng có mỉa mai không (loss.lambda_axis)
    axis_targets: gold    # gold: suy từ nhãn gốc | teacher: phán đoán của teacher (cần data.rationale.use)
    rationale_dim: 0      # > 0: phép chiếu sang không gian embedding reasoning (loss.lambda_rat), PhoBERT-base = 768
    cascade_threshold: 0.5
  head_hidden: 512
  dropout: 0.2

loss:
  name: ce            # ce | focal
  class_weight: null  # null | inverse | sqrt_inverse | effective
  gamma: 2.0          # chỉ dùng cho focal
  label_smoothing: 0.0
  lambda_s: 0.0       # hierarchical: BCE thêm cho tầng S (có châm biếm không)
  lambda_axis: 0.0    # BCE của head T/I
  lambda_rat: 0.0     # 1 - cos(phép chiếu vector fusion, embedding reasoning)

train:
  epochs: 10
  batch_size: 16
  eval_batch_size: 64
  grad_accum: 1
  lr_encoder: 2.0e-5
  lr_head: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  amp: true
  num_workers: 2
  early_stop_patience: 3
  resume_from: null   # file .pt hoặc thư mục chứa last.pt
  select_metric: macro_f1      # macro_f1 | weighted_f1: điểm val để chọn best.pt và early stopping
  select_exclude_labels: []    # macro_f1 bỏ các lớp này, vd [text-sarcasm] (val chỉ có 1 mẫu)
  eval_test: true              # chấm test (private test) cuối mỗi run; false = chỉ chấm một lần ở bước cuối

eval:
  prior_correction: false      # evaluate.py ghi thêm kết quả hiệu chỉnh prior theo val (hậu tố _prior)
