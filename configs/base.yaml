# Config gốc, các config thí nghiệm kế thừa bằng `inherit: base.yaml` và chỉ ghi đè phần khác.
seed: 42

# Đường dẫn theo môi trường, utils/config.py tự chọn nhánh ứng với môi trường đang chạy.
paths:
  local:
    data_dir: data/raw
    output_dir: outputs
    cache_dir: data/processed
  kaggle:
    data_dir: /kaggle/input/datasets/hhhoang/vimmsd-dataset   # đã xác nhận bằng notebooks/00_dataset_check.ipynb
    output_dir: /kaggle/working/outputs
    cache_dir: /kaggle/working/cache
  colab:
    data_dir: /content/drive/MyDrive/IE403/data/raw
    output_dir: /content/drive/MyDrive/IE403/outputs
    cache_dir: /content/drive/MyDrive/IE403/cache

data:
  # đường dẫn tương đối với paths.data_dir; kiểm tra lại tên file/thư mục sau khi tải ViMMSD
  train_json: vimmsd-train.json
  train_image_dir: training-images/train-images
  public_test_json: vimmsd-public-test.json      # không có nhãn, chỉ dùng để xuất dự đoán
  public_test_image_dir: public-test-images/dev-images
  private_test_json: vimmsd-private-test.json    # không có nhãn
  private_test_image_dir: private-test-images/test-images
  labels: [not-sarcasm, text-sarcasm, image-sarcasm, multi-sarcasm]
  val_ratio: 0.1     # val/test chia stratified từ tập train có nhãn
  test_ratio: 0.1
  max_length: 256           # giới hạn của PhoBERT; p95 độ dài caption sau làm sạch ≈ 251 token
  max_caption_length: 200   # khi có text từ ảnh: caption cắt trước còn tối đa 200 token, phần còn lại cho segment 2
  text:
    lowercase: false
    normalize_teencode: true
    emoji: demojize   # keep | remove | demojize (emoji phổ biến sang tiếng Việt, còn lại tên tiếng Anh)
    word_segment: vncorenlp   # vncorenlp (PhoBERT, cần Java) | underthesea | none (ViSoBERT)
    cache_dir: null   # null = paths.cache_dir. Notebook train trên Kaggle: /kaggle/input/<output 01a>/cache
  image_resize: pad    # pad (letterbox vuông, giữ toàn bộ ảnh) | crop (center-crop của processor, như code cũ)
  image_augment: false # crop 90-100% + chỉnh sáng/tương phản, chỉ khi train
  sampler: random     # random | weighted (oversampling lớp hiếm)
  # Tiền xử lý ảnh thành text (tạo trước bằng scripts/extract_image_text.py, xem notebooks/01b):
  # chữ trong ảnh (OCR) + mô tả ảnh (VLM), ghép thành segment thứ 2 của PhoBERT cạnh caption.
  image_text:
    use_ocr: false
    use_description: false
    dir: null                           # null = paths.cache_dir; Kaggle: thư mục output notebook 01b đã attach
    # đặt tên theo phiên bản: đổi model/prompt thì tăng số, không ghi đè cache cũ
    ocr_cache: ocr_v2.json                     # PaddleOCR phát hiện + VietOCR vgg_seq2seq, mỗi dòng một hàng
    description_cache: vlm_description_v1.json # Vintern-1B, prompt mô tả trung tính

model:
  modality: concat    # text | image | concat | cross_attn
  text_encoder:
    name: vinai/phobert-base
    freeze: false
  image_encoder:
    name: openai/clip-vit-base-patch32
    freeze: true
  fusion: {}
  head_hidden: 512
  dropout: 0.2

loss:
  name: ce            # ce | focal
  class_weight: null  # null | inverse | sqrt_inverse | effective
  gamma: 2.0          # chỉ dùng cho focal
  label_smoothing: 0.0

train:
  epochs: 10
  batch_size: 16
  eval_batch_size: 64
  grad_accum: 1
  lr_encoder: 2.0e-5
  lr_head: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  amp: true
  num_workers: 2
  early_stop_patience: 3
  resume_from: null   # file .pt hoặc thư mục chứa last.pt
